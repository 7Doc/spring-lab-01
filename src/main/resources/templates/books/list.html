<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}"
   class="flash"
   th:text="${message}">
</p>

<div>
    <p>
        Username:
        <span sec:authentication="name">anonymous</span>
    </p>

    <p>
        Authorities:
        <span sec:authentication="principal.authorities">[ROLE_USER]</span>
    </p>

    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/admin}">
        Administration
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>
</div>

<hr>

<h2>Search books</h2>

<form th:action="@{/books}" method="get">

    <label for="author">Filter by author:</label>

    <input id="author"
           type="text"
           name="author"
           th:value="${author}">

    <button type="submit">Search</button>

    <a th:href="@{/books}">Show all</a>

</form>

<hr>


<div sec:authorize="hasRole('ADMIN')">

    <h2>Add new book</h2>

    <form th:action="@{/books}" method="post">

        <div>
            <label for="title">Title:</label>
            <input id="title"
                   type="text"
                   name="title"
                   required>
        </div>

        <div>
            <label for="new-author">Author:</label>
            <input id="new-author"
                   type="text"
                   name="author"
                   required>
        </div>

        <div>
            <label for="year">Year:</label>
            <input id="year"
                   type="number"
                   name="year"
                   required>
        </div>

        <button type="submit">Add book</button>

    </form>

</div>

<hr>

<h2>Books catalogue</h2>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
        <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">

        <td th:text="${book.id}">1</td>

        <td th:text="${book.title}">Title</td>

        <td th:text="${book.author}">Author</td>

        <td th:text="${book.year}">2020</td>


        <td sec:authorize="hasRole('ADMIN')">

            <form th:action="@{/books/{id}/delete(id=${book.id})}"
                  method="post">

                <button type="submit"
                        onclick="return confirm('Are you sure you want to delete this book?')">
                    Delete
                </button>

            </form>

        </td>

    </tr>
    </tbody>
</table>

</body>
</html>
